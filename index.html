<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bear's Spelling Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, one task per screen. Forest-lake palette; large Lexend type for easy reading. */
:root{
  --bg:#EAF2EE; --surface:#FFFFFF; --ink:#1E2B2C; --muted:#56686A; --line:#CFDDD7;
  --lake:#2B6C93; --lake-soft:#DCEBF3; --pine:#2E6B4C; --pine-soft:#DDEFE4;
  --salmon:#D9654D; --salmon-soft:#FBE4DD; --amber:#9A6200; --amber-soft:#FBEFD6; --gold:#B8860B;
  --fur:#8A5A3B; --fur-light:#D9B48F; --nose:#2A1D16; --on-accent:#FFFFFF;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111A1B; --surface:#1A2627; --ink:#E6EFEC; --muted:#9CB0AE; --line:#2C3D3E;
  --lake:#78B6DB; --lake-soft:#1C3442; --pine:#79CC9F; --pine-soft:#1B3528;
  --salmon:#F2907A; --salmon-soft:#3D2420; --amber:#E9B551; --amber-soft:#3A2D12; --gold:#E9C46A; --on-accent:#111A1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111A1B; --surface:#1A2627; --ink:#E6EFEC; --muted:#9CB0AE; --line:#2C3D3E;
  --lake:#78B6DB; --lake-soft:#1C3442; --pine:#79CC9F; --pine-soft:#1B3528;
  --salmon:#F2907A; --salmon-soft:#3D2420; --amber:#E9B551; --amber-soft:#3A2D12; --gold:#E9C46A; --on-accent:#111A1B; color-scheme:dark}
html,body{height:100%}
select.field{appearance:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:640px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem;margin-top:6px}
p{margin:0} .muted{color:var(--muted)} .small{font-size:.88rem} .tab{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-visible{outline:3px solid var(--lake);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:600;font-size:1.1rem;background:var(--salmon);color:var(--on-accent);min-height:52px;display:inline-flex;align-items:center;justify-content:center}
.btn.secondary{background:var(--surface);color:var(--ink);border:2px solid var(--line);font-size:1rem;min-height:46px}
.btn.danger{color:var(--salmon)}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--lake);text-decoration:underline;padding:6px 0;font-size:.95rem}
.link.center{align-self:center}
.card{background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.hero{display:flex;gap:14px;align-items:center}
.hero svg{width:84px;flex:none}
.herotext{display:flex;flex-direction:column;gap:6px;min-width:0}
.fishcount{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--lake);font-variant-numeric:tabular-nums}
.fishcount svg{width:30px;height:18px}
.streak{background:var(--amber-soft);color:var(--amber);padding:3px 11px;border-radius:99px;font-weight:600;font-size:.85rem;white-space:nowrap}
.top{display:flex;align-items:center;gap:12px}
.back{background:var(--surface);border:0;border-radius:12px;width:46px;height:46px;font-size:1.3rem;flex:none}
.bar{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar.big{flex:none;height:16px}
.bar>i{display:block;height:100%;background:var(--pine);border-radius:99px;transition:width .3s}
.step{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.step>span:last-child{display:flex;flex-direction:column}
.step.primary{background:var(--lake);border-color:var(--lake);color:var(--on-accent)}
.step.primary .muted{color:inherit;opacity:.85}
.stepn{font-family:var(--display);font-weight:600;min-width:64px;font-size:.95rem}
.phases{display:flex;flex-direction:column;gap:8px}
.phase{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.phase.open{border-color:var(--lake)}
.phead{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:10px 12px;text-align:left}
.ptext{display:flex;flex-direction:column;flex:1;min-width:0}
.pnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--lake-soft);color:var(--lake);font-family:var(--display);font-weight:600;flex:none}
.pnum.done{background:var(--pine);color:var(--on-accent)}
.units{list-style:none;margin:0;padding:0 10px 10px;display:flex;flex-direction:column;gap:6px}
.unit{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);border:0;border-radius:12px;padding:8px 10px}
.utext{display:flex;flex-direction:column;flex:1;min-width:0}
.udot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);flex:none;font-weight:600;font-size:.9rem}
.unit.open .udot{border-color:var(--lake);border-width:3px}
.unit.passed .udot{background:var(--pine);border-color:var(--pine);color:var(--on-accent)}
.unit.mastered .udot{background:var(--gold);border-color:var(--gold);color:var(--on-accent)}
.unit.locked{opacity:.5;cursor:default}
.ani{font-size:1.4rem}
.friends{display:flex;flex-wrap:wrap;gap:6px}
.friend{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:var(--pine-soft)}
.treasure{justify-content:space-between}
.pieces{display:flex;gap:3px}
.pieces i{width:16px;height:20px;border-radius:3px;background:var(--line)}
.pieces i.got{background:var(--amber)}
.gems{display:inline-flex;align-items:center;gap:8px}
.gem{width:18px;height:18px;background:var(--lake);transform:rotate(45deg);border-radius:3px;flex:none;display:inline-block}
.gem.big{width:30px;height:30px;margin:6px}
.rule{background:var(--lake-soft);border-radius:14px;padding:14px 16px}
.rtext{font-size:1.15rem;font-weight:500}
.examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ex{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-size:1.2rem;letter-spacing:.03em}
.hl{color:var(--salmon);font-weight:600}
.dotsep{color:var(--muted);padding:0 2px}
.prompt{font-family:var(--display);font-weight:500;font-size:1.25rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.c3{grid-template-columns:1fr 1fr 1fr}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 8px;font-size:1.4rem;letter-spacing:.04em;min-height:70px;overflow-wrap:anywhere}
.choice.right{border-color:var(--pine);background:var(--pine-soft)}
.choice.wrong{border-color:var(--amber);background:var(--amber-soft)}
.choice:disabled{cursor:default}
.gapword{font-size:2.3rem;letter-spacing:.08em;text-align:center;font-weight:500}
.gapword.small2{font-size:1.8rem}
.hole{display:inline-block;min-width:1.4em;border-bottom:4px solid var(--salmon);color:var(--salmon)}
.bigword{font-size:2.3rem;letter-spacing:.1em;text-align:center;font-weight:500;padding:6px 0;overflow-wrap:anywhere}
.speak{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 16px;display:inline-flex;gap:8px;align-items:center;align-self:center;font-weight:500}
.speak.big{padding:18px 26px;font-size:1.2rem;border-color:var(--lake);color:var(--lake)}
.speak svg{width:22px;height:22px}
form{display:flex;flex-direction:column;gap:10px}
input.spell{font:inherit;font-size:1.8rem;letter-spacing:.08em;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.built{min-height:62px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:1.8rem;padding:6px;flex-wrap:wrap}
.built span{background:var(--lake-soft);border-radius:8px;padding:0 8px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-size:1.4rem}
.tile:disabled{opacity:.3}
.fb{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--pine-soft)} .fb.good h3{color:var(--pine)}
.fb.try{background:var(--amber-soft)} .fb.try h3{color:var(--amber)}
.diff{display:flex;flex-direction:column;gap:2px}
.diff .lbl{font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.diff .ltrs{font-size:1.6rem;letter-spacing:.12em;overflow-wrap:anywhere}
.diff mark{background:none;color:var(--salmon);text-decoration:underline 3px;text-underline-offset:5px}
.diff s{color:var(--muted)}
.done{align-items:center;text-align:center}
.done svg.bear{width:100px}
.prize{background:var(--amber-soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;box-sizing:border-box}
.bigani{font-size:3rem;line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stats div{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
label{font-size:.9rem;font-weight:500}
.field{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.field.grow{flex:1;min-width:140px;width:auto}
.filebtn{cursor:pointer}
.check{display:flex;gap:10px;align-items:center}
.check input{width:22px;height:22px}
@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}
.fb{animation:pop .18s ease-out}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.choice{font-size:1.15rem}.choices.c3{grid-template-columns:1fr}.gapword,.bigword{font-size:1.8rem}h1{font-size:1.45rem}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.goal{display:flex;align-items:center;gap:12px}.goal .bar{flex:1}
.btn.go{flex-direction:column;min-height:96px;font-size:2rem;gap:0;width:100%}
.btn.go .cap{font-size:1rem;font-weight:500;opacity:.9}
.center-t{text-align:center}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile3{background:var(--surface);border:0;border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.t3i{font-size:1.8rem;line-height:1.2}
.tile3 .gem.big{margin:8px}
.fishcount.small2{font-size:1rem}
.pieces.big i{width:28px;height:34px}
.endt{font-size:2.2rem;display:flex;align-items:center;gap:8px}.endt svg{width:48px;height:30px}
.score{font-family:var(--display);font-size:1.4rem;color:var(--muted)}
.fb h3{display:flex;align-items:center;gap:6px}.fb h3 svg{width:30px;height:18px}
.rule{display:flex;flex-direction:column;gap:10px}
.top h2{flex:1}
.cue{align-self:center;display:inline-flex;align-items:center;gap:8px;background:var(--lake-soft);border-radius:99px;padding:6px 16px 6px 8px;font-size:1.05rem}
.cuei{font-size:1.6rem;line-height:1}
.fb.same{background:var(--lake-soft)} .fb.same h3{color:var(--lake)}
.divider{margin:10px 4px 0;color:var(--amber)}
.heart{color:var(--salmon);font-weight:700;text-decoration:underline wavy var(--salmon);text-underline-offset:5px}
.heart::after{content:'♥';font-size:.5em;vertical-align:super;margin-left:1px}
.hunt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 14px}
.hw{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:1.25rem;min-height:48px}
.hw.found{border-color:var(--gold);background:var(--amber-soft)}
.hw.wrong{border-color:var(--amber)}
textarea.sentence{font-family:var(--body),system-ui,sans-serif;font-size:1.3rem;letter-spacing:.02em;text-align:left;resize:vertical;margin:10px 0}
.sentshow{font-size:1.3rem;line-height:1.6}
.sentshow mark{background:var(--amber-soft);color:var(--ink);padding:0 3px;border-radius:4px}
.fams{display:grid;gap:10px}
.fam{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.famk{font-size:1.4rem;min-width:70px}
.names{display:grid;gap:12px;margin-top:16px}
.btn.name{font-size:1.5rem;padding:20px}
.center-row{justify-content:center;gap:16px}
.pickani{font-size:3rem;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 18px;min-width:88px}
.pickani:hover{border-color:var(--pine)}
</style>

</head>
<body>
<div id="app"></div>
<script>
/* ---------- Scope and sequence: 9 phases, phoneme-grapheme units ----------
 Entry formats in w (space separated):
   r[ai]n          marked spelling choice; wrong options come from the unit's alts
   rab-bit         syllables (mode syl)
   taste+y>tasty   base + ending (mode suf); omit >result when it is a plain join
   take>took       base word to new word (mode map)
   ~wrong          extra wrong spellings to offer, e.g. s[ai]d~sed
*/
const PHASES=[
 {n:1,name:'Sound Pond',sub:'Short vowels and blends',animal:'🐸'},
 {n:2,name:'Letter Team Meadow',sub:'sh, ch, ck, ff, tch, dge, ng',animal:'🐝'},
 {n:3,name:'Silent E Hill',sub:'Magic e and soft c, g',animal:'🐐'},
 {n:4,name:'Vowel Team Forest',sub:'Two letters, one vowel sound',animal:'🦉'},
 {n:5,name:'Bossy R River',sub:'ar, or, er, ir, ur',animal:'🦦'},
 {n:6,name:'Syllable Mountain',sub:'Long words, one part at a time',animal:'🐐'},
 {n:7,name:'Ending Caves',sub:'Rules for adding endings',animal:'🦇'},
 {n:8,name:'Tricky Word Rocks',sub:'Heart words and changing past',animal:'🦎'},
 {n:9,name:'Hidden Vowel Island',sub:'Schwa, word families, endings',animal:'🐢'}];

const UNITS=[
 // Phase 1
 {id:'1.1',p:1,t:'Short a, i, o',k:'short vowels',r:'One vowel between two consonants makes its short sound.',alts:['a','i','o'],
  w:'m[a]p s[i]t h[o]t b[a]g w[i]n l[o]g c[a]mp f[i]sh p[o]nd r[a]n'},
 {id:'1.2',p:1,t:'Short e and u',k:'short vowels',r:'Listen for the middle sound: e as in bed, u as in cup.',alts:['e','u','i'],
  w:'b[e]d c[u]p r[e]d s[u]n n[e]t b[u]g t[e]n j[u]mp sl[e]d dr[u]m'},
 {id:'1.3',p:1,t:'Blends',k:'two sounds side by side',r:'In a blend you hear every letter. Say it slowly so none goes missing.',mode:'drop',
  w:'[st]op [fr]og [gr]in [cl]ap [dr]ip [sp]ot ha[nd] la[mp] be[st] te[nt]'},
 // Phase 2
 {id:'2.1',p:2,t:'sh, ch, th',k:'digraphs',r:'Two letters can make one new sound.',alts:['sh','ch','th'],
  w:'[sh]ip [ch]ip [th]in fi[sh] ba[th] [ch]op [sh]ut mo[th] ben[ch] [th]ud'},
 {id:'2.2',p:2,t:'ck or k',k:'the /k/ sound at the end',r:'Right after a short vowel, use ck. After a consonant, use k.',alts:['ck','k','c'],
  w:'ba[ck] du[ck] pi[ck] ro[ck] ne[ck] tru[ck] ban[k] mil[k] des[k] dar[k]'},
 {id:'2.3',p:2,t:'ff, ll, ss',k:'doubled letters',r:'Short word, short vowel, ends in f, l or s? Double it.',alts:{ll:['l'],ss:['s'],ff:['f']},
  w:'be[ll] hi[ll] gra[ss] me[ss] o[ff] cli[ff] sti[ll] dre[ss] pu[ff] she[ll]'},
 {id:'2.4',p:2,t:'tch or ch',k:'the /ch/ sound at the end',r:'Right after a short vowel, use tch. Anywhere else, use ch.',alts:['tch','ch'],
  w:'ca[tch] pi[tch] ma[tch] fe[tch] sti[tch] ske[tch] lun[ch] bun[ch] bea[ch] coa[ch]'},
 {id:'2.5',p:2,t:'dge or ge',k:'the /j/ sound at the end',r:'Right after a short vowel, use dge. Anywhere else, use ge.',alts:['dge','ge'],
  w:'e[dge] bri[dge] ba[dge] ju[dge] fu[dge] le[dge] hu[ge] pa[ge] sta[ge] ca[ge]'},
 {id:'2.6',p:2,t:'ng and nk',k:'nose sounds',r:'ng rings like a bell: sing. nk ends with a k sound: sink.',alts:['ng','nk'],
  w:'si[ng] ki[ng] ba[nk] thi[nk] lo[ng] dri[nk] stro[ng] ju[nk] wi[ng] pi[nk]'},
 // Phase 3
 {id:'3.1',p:3,t:'Magic e: a_e and i_e',k:'long a and long i',r:'A silent e at the end makes the vowel say its name: tap, tape.',alts:{e:['']},
  w:'lak[e] gam[e] tap[e] snak[e] shap[e] bit[e] kit[e] slid[e] prid[e] shin[e]'},
 {id:'3.2',p:3,t:'Magic e: o_e, u_e, e_e',k:'long o, long u, long e',r:'The silent e works for o, u and e too: hop, hope.',alts:{e:['']},
  w:'hop[e] bon[e] ston[e] not[e] smok[e] cub[e] tub[e] hug[e] flut[e] thes[e]'},
 {id:'3.3',p:3,t:'Soft c and soft g',k:'c says s, g says j',r:'Before e, i or y, c says /s/ and g often says /j/.',alts:{c:['s'],g:['j']},
  w:'[c]ity [c]ircle fa[c]e i[c]e ra[c]e pen[c]il [g]em [g]iant pa[g]e gin[g]er'},
 // Phase 4
 {id:'4.1',p:4,t:'ai or ay',k:'long a',r:'ai goes in the middle of a word. ay goes at the end.',alts:['ai','ay'],
  w:'br[ai]n tr[ai]l p[ai]nt ch[ai]n sn[ai]l d[ay] pl[ay] st[ay] tr[ay] l[ay]'},
 {id:'4.2',p:4,t:'ee or ea',k:'long e',r:'Both say long e. Picture the word: green has ee, dream has ea.',alts:['ee','ea'],
  w:'gr[ee]n tr[ee] qu[ee]n sl[ee]p sh[ee]p [ea]t dr[ea]m l[ea]f t[ea]ch cl[ea]n'},
 {id:'4.3',p:4,t:'y at the end',k:'the ee sound at the end',r:'At the end of a longer word, the ee sound is spelled y. Never ey.',alts:['y','ey','ee'],
  w:'happ[y] funn[y] sunn[y] bab[y] ver[y] tast[y] hungr[y] sleep[y] lad[y] stor[y]'},
 {id:'4.4',p:4,t:'oa or ow',k:'long o',r:'oa goes in the middle. ow goes at the end.',alts:['oa','ow'],
  w:'b[oa]t fl[oa]t c[oa]t s[oa]p g[oa]t gr[ow] sn[ow] sl[ow] bl[ow] thr[ow]'},
 {id:'4.5',p:4,t:'igh or y',k:'long i',r:'igh is often followed by t. A short word ending in long i uses y.',alts:{igh:['ie','i'],y:['ie','igh']},
  w:'l[igh]t m[igh]t br[igh]t f[igh]t fl[igh]t fl[y] sk[y] cr[y] dr[y] sh[y]'},
 {id:'4.6',p:4,t:'oo, ew, ue',k:'the oo sound as in moon',r:'oo goes in the middle. At the end, ew is most common, then ue.',alts:['oo','ew','ue'],
  w:'m[oo]n f[oo]d sp[oo]n z[oo] dr[ew] ch[ew] f[ew] gr[ew] gl[ue] tr[ue]'},
 {id:'4.7',p:4,t:'oo as in book',k:'the short oo sound',r:'oo can also make the short sound in book, look and took.',alts:['oo','u','ou'],

const VOWELS='aeiou';
EXTRA.forEach(e=>{const i=UNITS.findIndex(u=>u.id===e.after);UNITS.splice(i+1,0,e)});
function parseEntry(raw,u){
  const [main,...wrong]=raw.split('~');
  const it={unit:u.id,wrong:wrong.slice()};
  if(u.mode==='map'){const [a,b]=main.split('>');it.kind='map';it.base=a.replace(/_/g,' ');it.w=b;}
  else if(main.includes('+')){
    const [l,res]=main.split('>');const [a,s]=l.split('+');
    it.kind='suf';it.base=a;it.suf=s;it.w=res||a+s;
    const naive=a+s; if(naive!==it.w) it.wrong.push(naive);
    const alts=(u.alts&&u.alts[s])||[];
    alts.forEach(x=>{const v=a+x; if(v!==it.w) it.wrong.push(v)});
    if(!it.wrong.length){ // a prefix or plain join: drop a doubled letter as the trap
      const m=it.w.match(/(.)\1/); if(m) it.wrong.push(it.w.replace(m[0],m[1]));
    }
  }
  else if(u.mode==='syl'){it.kind='syl';it.syl=main.split('-');it.w=it.syl.join('');
    const i=Math.floor(Math.random()*it.syl.length), s=it.syl[i], vi=[...s].findIndex(c=>VOWELS.includes(c));
    if(vi>=0){const nv=[...VOWELS].filter(v=>v!==s[vi]);const alt=s.slice(0,vi)+nv[(s.length+i)%nv.length]+s.slice(vi+1);
      it.decoy=alt; it.wrong.push(it.syl.map((x,j)=>j===i?alt:x).join(''));}
    if(it.syl.length>2) it.wrong.push(it.syl.filter((x,j)=>j!==1).join(''));
  }
  else if(main.includes('[')){
    const m=main.match(/^(.*)\[(.*)\](.*)$/);it.kind='mark';it.pre=m[1];it.g=m[2];it.post=m[3];it.w=m[1]+m[2]+m[3];
    let alts=[];
    if(u.mode==='drop'){const g=it.g;alts=[g.slice(1),g.slice(0,-1),g.split('').reverse().join('')];}
    else if(Array.isArray(u.alts)) alts=u.alts.filter(a=>a!==it.g);
    else if(u.alts) alts=u.alts[it.g]||[];
    it.galts=[...new Set(alts)].filter(a=>a!==it.g);
    it.galts.forEach(a=>{const v=it.pre+a+it.post; if(v!==it.w) it.wrong.push(v)});
  }
  else {it.kind='word';it.w=main;}
  if(!it.wrong.length) it.wrong=(WRONG[it.w]||[]).slice();
  if(!it.wrong.length) it.wrong=misspell(it.w);
  it.wrong=[...new Set(it.wrong)].filter(x=>x&&x!==it.w&&!(ACCEPT[it.w]||[]).includes(x));
  it.key=u.id+':'+it.w;
  return it;
}

/* ---------- Rounds ---------- */
const PLAN=['choose','spell','hunt','spell','choose','spell'];
function qType(it,pref){
  if(pref==='hunt') return it.wrong.length?'hunt':'spell';
  if(pref==='choose'&&ROOT_UNITS.includes(it.unit)&&rootOf(it.w)) return 'root';
  if(pref==='choose'){if(it.kind==='mark'&&it.galts&&it.galts.some(a=>a))return 'gap';if(it.kind==='syl')return 'build';if(it.kind==='suf')return 'join';if(it.kind==='map')return 'base';pref='pick'}
  if(pref==='pick') return it.wrong.length?'pick':'spell';
  return 'spell';
}
function startUnit(u){
  const items=shuffle(u.items).sort((a,b)=>{const A=S.words[a.key]||{b:0,s:0},B=S.words[b.key]||{b:0,s:0};return A.b-B.b||A.s-B.s}).slice(0,6);
  const q=shuffle(items).map((it,i)=>({it,type:qType(it,PLAN[i%PLAN.length])}));
  if(speaking()&&u.p&&SENT[u.id]&&sentTargets(u).length) q.push({type:'dict',bonus:true,it:{key:'dict'}});
  RUN={kind:'unit',unit:u,q,i:0,fish:0,first:{},n:q.length-(q[q.length-1].bonus?1:0)}; showQ();
}
function startReview(){
  const keys=dueKeys().slice(0,6); if(!keys.length) return home();
  const q=keys.map(k=>({it:itemByKey(k),type:'spell'}));
  RUN={kind:'review',q,i:0,fish:0,first:{},n:q.length}; showQ();
}
function startCheck(p){
  const us=phaseUnits(p).filter(u=>u.mode!=='mix');
  const q=us.map(u=>({it:shuffle(u.items)[0],type:speaking()?'spell':'pick',check:true}));

}
function topBar(){

function showQ(){

function ruleOf(it){const u=it.unit==='my'?myUnit():UNIT_BY_ID[it.unit];return u?u.r:''}
function answer(q,ok,attempt){

  const el=$('fb'); el.hidden=false;
  if(ok){el.className='fb good';el.innerHTML=`<h3>${q.retry?'Fixed it!':'Yes!'}${firstTime?' +1 '+FISH:''}</h3>`;}
  else{el.className='fb try';el.innerHTML=`<h3>Almost!</h3>${attempt!=null?diffHTML(attempt,it.w):''}${attempt==null?`<div class="bigword">${heartHTML(it.w)||esc(it.w)}</div>`:''}<p>${esc(ruleOf(it))}</p>`;}
  el.innerHTML+=`<button class="btn block" id="nextBtn">Next</button>`;
  if(!ok) setTimeout(()=>say(it.w),200);

function choiceQ(q,prompt,head,opts,correct,onPick){

   <div id="fb" hidden></div></section>`;

function qBuild(q){
  const it=q.it, tiles=shuffle([...it.syl,it.decoy||'']).filter(Boolean); let picked=[];

   <button class="link" id="undo">Undo</button><div id="fb" hidden></div></section>`;

function typeForm(prompt){

/* Treasure hunt: one word is misspelled. Find it, then fix it from memory. */
function qHunt(q){
  const it=q.it, bad=shuffle(it.wrong)[0], u=UNIT_BY_ID[it.unit]||{items:[]}, s=SENT[it.unit];
  let toks;
  if(s&&words(s).includes(it.w.toLowerCase())){toks=s.split(' ').map(t=>{const core=t.replace(/[^A-Za-z'’]/g,'');return core.toLowerCase()===it.w.toLowerCase()?{t:t.replace(core,bad),bad:true}:{t}})}
  else toks=shuffle([{t:bad,bad:true},...shuffle(u.items.filter(x=>x.w!==it.w)).slice(0,3).map(x=>({t:x.w}))]);
  app.innerHTML=`${topBar()}<section class="card"><p class="prompt">Find the mistake 🔍</p>
   <div class="hunt">${toks.map((k,i)=>`<button class="hw" data-i="${i}">${esc(k.t)}</button>`).join(' ')}</div>
   <div id="wrap" hidden>${typeForm('Fix it')}</div><div id="fb" hidden></div></section>`;
  app.querySelectorAll('.hw').forEach(b=>b.onclick=()=>{const k=toks[+b.dataset.i];app.querySelectorAll('.hw').forEach(x=>x.disabled=true);
    if(k.bad){b.classList.add('found');$('wrap').hidden=false;$('spellIn').focus();}
    else{b.classList.add('wrong');app.querySelectorAll('.hw').forEach(x=>{if(toks[+x.dataset.i].bad)x.classList.add('found')});answer(q,false,null)}});
  bindType(q);
  if(speaking()) setTimeout(()=>say('Find the mistake.'),250);
}
/* Root Canyon: what does the root mean? */
function qRoot(q){
  const it=q.it, r=rootOf(it.w), others=shuffle([...new Set(ROOTS.map(x=>x[1]))].filter(m=>m!==r.m)).slice(0,2), opts=shuffle([r.m,...others]);
  const head=`<div class="gapword small2">${esc(it.w.slice(0,r.i))}<b class="hl">${esc(r.r)}</b>${esc(it.w.slice(r.i+r.r.length))}</div>`;
  choiceQ(q,`<b>${esc(r.r)}</b> means…`,head,opts,r.m);
}
/* Dictation: hear a sentence, write it. Bonus fish for each word from this stop. */
function qDict(q){
  const u=RUN.unit, s=SENT[u.id], targets=sentTargets(u);
  app.innerHTML=`${topBar()}<section class="card"><p class="prompt">Hear it, write it</p>
   <div class="row center-row"><button class="speak big" id="hearS">${ICON_SPEAK}Hear it</button>${slowBtn('slowS')}</div>
   <form id="df" autocomplete="off"><label for="dIn" class="sr">Write the sentence</label>
    <textarea id="dIn" class="spell sentence" rows="3" autocapitalize="sentences" autocorrect="off" spellcheck="false"></textarea>
    <button class="btn block" type="submit">Check</button></form><div id="fb" hidden></div></section>`;
  const play=()=>say(s); $('hearS').onclick=play; $('slowS').onclick=()=>saySlow(s); setTimeout(()=>{if(!$('dIn'))return;play();$('dIn').focus()},250);
  $('df').onsubmit=e=>{e.preventDefault();const typed=words($('dIn').value);if(!typed.length)return;
    $('df').querySelectorAll('textarea,button').forEach(x=>x.disabled=true);
    let got=0; const miss=new Set();
    targets.forEach(it=>{if(typed.includes(it.w.toLowerCase())||(ACCEPT[it.w]||[]).some(a=>typed.includes(a)))got++;else{miss.add(it.w.toLowerCase());mark(it,false)}});
    RUN.fish+=got; RUN.dict={got,of:targets.length};
    const shown=s.split(' ').map(t=>{const c=t.replace(/[^A-Za-z'’]/g,'').toLowerCase();return miss.has(c)?`<mark>${esc(t)}</mark>`:targets.some(x=>x.w.toLowerCase()===c)?`<b class="hl">${esc(t)}</b>`:esc(t)}).join(' ');
    const el=$('fb');el.hidden=false;el.className='fb '+(miss.size?'try':'good');
    el.innerHTML=`<h3>${miss.size?'Almost!':'Yes!'} +${got} ${FISH}</h3><p class="sentshow">${shown}</p><button class="btn block" id="nextBtn">Next</button>`;
    $('nextBtn').onclick=()=>{RUN.i++;showQ()}; el.scrollIntoView({behavior:'smooth',block:'nearest'}); save();};
}
function diffHTML(a,b){
  const n=a.length,m=b.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const kA=new Set(),kB=new Set();let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){kA.add(i);kB.add(j);i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}
  return `<div class="diff"><span class="lbl">You wrote</span><span class="ltrs">${[...a].map((c,k)=>kA.has(k)?esc(c):`<s>${esc(c)}</s>`).join('')}</span>
    <span class="lbl">Correct spelling</span><span class="ltrs">${[...b].map((c,k)=>kB.has(k)?esc(c):`<mark>${esc(c)}</mark>`).join('')}</span></div>`;
}

/* ---------- End of a round ---------- */
function endRound(){
  const R=RUN, t=dayNum(), td=today(), firstRight=Object.values(R.first).filter(Boolean).length, n=R.n;
  const missed=Object.entries(R.first).filter(([k,v])=>!v).map(([k])=>k.split(':')[1]);
  const before=td.fish; td.fish+=R.fish; td.rounds++; S.fish+=R.fish;
  if(S.streak.last!==t){S.streak={last:t,count:S.streak.last===t-1?S.streak.count+1:1}}
  const gem=before<GOAL&&td.fish>=GOAL; if(gem) S.gems++;
  const piecesBefore=PHASES.filter(p=>!p.bank&&phaseDone(p.n)).length;
  let status='', newFriend=null, unitTxt='', phaseTxt='', nextCheck=0;
  if(R.kind==='unit'&&R.unit.p){
    const u=R.unit, st=S.units[u.id]||(S.units[u.id]={}); st.rounds=(st.rounds||0)+1; st.best=Math.max(st.best||0,firstRight);
    const spellOk=R.q.slice(0,n).every(q=>q.type!=='spell'||R.first[q.it.key]);
    if(firstRight>=n-1&&spellOk){ if(!st.passed){st.passed=true;st.passDay=t;newFriend=u;status='passed'}
      else if(!st.mastered&&t!==st.passDay){st.mastered=true;status='mastered'} else status=st.mastered?'mastered':'passed';}
    else status='keep practising';
    unitTxt=unitLabel(u); phaseTxt=String(u.p); S.lastTrack=u.bank?'bank':'trail';
  } else if(R.kind==='check'){
    const misses=Object.values(R.first).filter(v=>!v).length;
    R.q.forEach(q=>{if(R.first[q.it.key]){const st=S.units[q.it.unit]||(S.units[q.it.unit]={});if(!st.passed){st.passed=true;st.passDay=t;st.via='check';
      // skipped words still get checked later: spread them through review over the next 60 days
      UNIT_BY_ID[q.it.unit].items.forEach((it,j)=>{if(!S.words[it.key])S.words[it.key]={b:2,due:t+1+((j*7+UNITS.indexOf(UNIT_BY_ID[q.it.unit])*3)%60),s:1,r:1}})}}});
    UNITS.filter(u=>u.p===R.phase&&u.mode==='mix').forEach(u=>{if(phaseUnits(R.phase).filter(x=>x.mode!=='mix').every(x=>unitState(x.id).passed)){(S.units[u.id]=S.units[u.id]||{}).passed=true}});
    const stop=misses>=2; S.placement.phase=R.phase;
    if(R.phase<=10) nextCheck=(stop||R.phase===10)?11:R.phase+1; else if(!stop&&R.phase<13) nextCheck=R.phase+1;
    if(!nextCheck) S.placement.done=true; R.toGold=R.phase<=10&&nextCheck===11;
    status=stop?'check finished':'check passed'; unitTxt='Quick check'; phaseTxt=String(R.phase);
  } else {if(R.kind==='review') td.reviews=(td.reviews||0)+1; status='review';unitTxt=R.kind==='review'?'Mixed review':'My story words';phaseTxt='';}
  const piece=PHASES.filter(p=>!p.bank&&phaseDone(p.n)).length>piecesBefore;
  const now=new Date();
  logRound([dayLabel(t),now.toTimeString().slice(0,5),R.kind==='unit'?'Lesson':R.kind==='check'?'Check':'Review',phaseTxt,unitTxt,firstRight+'/'+n,R.fish,missed.join(', '),status,S.gems]);
  save(true);
  const cur=currentUnit();
  const title=R.kind==='check'?(R.toGold?'Now: gold words!':nextCheck?'Checkpoint cleared!':'Check done!'):`+${R.fish} `;
  const again=status==='keep practising';
  const btn=nextCheck?['cont','Keep going']:again?['nx','Try again']:cur?['nx','Next stop']:null;
  app.innerHTML=`<section class="card done">
    <h2 class="endt">${title}${R.kind==='check'?'':FISH}</h2>
    <p class="score tab">${firstRight}/${n}</p>
    ${newFriend?`<div class="prize" id="pf"><b>Pick a friend</b><div class="row center-row">${friendChoices(newFriend).map(a=>`<button class="pickani" data-a="${a}">${a}</button>`).join('')}</div></div>`:''}
    ${status==='mastered'&&R.kind==='unit'?`<div class="prize"><span class="bigani">★</span><b>Mastered!</b></div>`:''}
    ${gem?`<div class="prize"><span class="gem big"></span><b>Daily goal! +1 gem</b></div>`:''}
    ${piece?`<div class="prize"><span class="bigani">🗺️</span><b>Map piece!</b></div>`:''}
    ${again?`<p>Spell every listening word right to pass.</p>`:''}
    ${btn?`<button class="btn block" id="${btn[0]}">${btn[1]}</button>`:''}
    <button class="btn secondary block" id="home">Home</button></section>`;
  if(newFriend) app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;(S.units[newFriend.id]||{}).friend=a;(S.friends=S.friends||[]).push(a);save();
    $('pf').innerHTML=`<span class="bigani">${a}</span>`; say('Hello, friend!')});
  if($('cont')) $('cont').onclick=()=>startCheck(nextCheck);
  if($('nx')) $('nx').onclick=()=>intro(status==='keep practising'&&R.unit?R.unit.id:cur.id);
  $('home').onclick=()=>{OPEN_PHASE=null;home()};
  SCREEN='end'; RUN=null; window.scrollTo(0,0);
}
function friendChoices(u){const i=UNITS.indexOf(u), have=S.friends||[];
  const pool=ANIMALS.filter(a=>!have.includes(a)); const src=pool.length>=2?pool:ANIMALS;
  return [src[(i*7)%src.length],src[(i*7+3)%src.length]].filter((a,j,arr)=>arr.indexOf(a)===j)}

/* ---------- Grown-ups ---------- */
function grownups(){
  const passed=UNITS.filter(u=>unitState(u.id).passed).length, mastered=UNITS.filter(u=>unitState(u.id).mastered).length;
  const days=Object.keys(S.days).length, t=dayNum();
  let r7=0,n7=0; for(let d=t-6;d<=t;d++){const x=S.days[d];if(x){r7+=x.right;n7+=x.total}}
  const tricky=Object.entries(S.words).filter(([k,w])=>w.s>=2&&w.r/w.s<.67).sort((a,b)=>a[1].r/a[1].s-b[1].r/b[1].s).slice(0,20).map(([k])=>k.split(':')[1]);
  const recent=(S.log||[]).slice(-10).reverse();
  SCREEN='grown';
  app.innerHTML=`<div class="top"><button class="back" id="back" aria-label="Back to the trail">←</button><span class="muted">Grown-ups</span></div>
   <section class="card"><h2>Students</h2>
    <p class="small muted">Each student has their own progress. With two or more, the app asks "Who's practising?" when it opens. The name goes in the sheet's Student column.</p>
    ${ROSTER.students.map(x=>`<div class="row"><input class="field grow" data-nm="${esc(x.id)}" value="${esc(x.name)}" placeholder="Name" aria-label="Student name"><span class="small muted">${x.id===student().id?'now practising':''}</span>${ROSTER.students.length>1&&x.id!==student().id?`<button class="link" data-rm="${esc(x.id)}">remove</button>`:''}</div>`).join('')}
    <div class="row"><button class="btn secondary" id="saveNames">Save names</button><button class="btn secondary" id="addSt">Add a student</button><span class="small muted" id="stMsg"></span></div>
   </section>
   <section class="card"><h2>Progress: ${esc(studentName())}</h2>
    <div class="row"><button class="btn secondary" id="map">Choose a stop</button></div>
    <div class="stats">
      <div><b>${passed}/${UNITS.length}</b><span>stops passed</span></div>
      <div><b>${mastered}</b><span>stops mastered</span></div>
      <div><b>${days}</b><span>days practised</span></div>
      <div><b>${n7?Math.round(r7/n7*100)+'%':'–'}</b><span>first-try accuracy, last 7 days</span></div>
      <div><b>${dueKeys().length}</b><span>words due for review</span></div>
    </div>
    <div class="tablewrap"><table><thead><tr><th>Phase</th><th>Passed</th><th>Mastered</th></tr></thead><tbody>
     ${PHASES.map(p=>{const us=phaseUnits(p.n);return `<tr><td>${p.n}. ${esc(p.name)}</td><td class="tab">${us.filter(u=>unitState(u.id).passed).length}/${us.length}</td><td class="tab">${us.filter(u=>unitState(u.id).mastered).length}</td></tr>`}).join('')}
    </tbody></table></div>
    <h3>Tricky words</h3>${tricky.length?`<p>${tricky.map(esc).join(', ')}</p>`:'<p class="small muted">None yet. Words she misses more than once show here.</p>'}
    <h3>Recent rounds</h3>${recent.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Unit</th><th>Score</th><th>Missed</th></tr></thead><tbody>${recent.map(r=>`<tr><td class="tab">${esc(r[0])} ${esc(r[1])}</td><td>${esc(r[4])}</td><td class="tab">${esc(r[5])}</td><td>${esc(r[7])}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">No rounds yet.</p>'}
    <p class="small muted">A stop passes at 5 of 6 right on the first try, including every listen-and-spell word. It is mastered after a second pass on a later day. Missed words come back in review sooner; known words come back after 1, 2, 4, 7 and 14 days.</p>
   </section>
   <section class="card"><h2>Google Sheet</h2>
    ${IN_CLAUDE?`<p class="small">Paste the link to your "Practice progress" sheet. Each round adds a row to its Spelling tab. Claude asks once for permission to use Google Sheets.</p>
      <label for="sheet">Sheet link</label><input class="field" id="sheet" value="${esc(S.sheetId?'https://docs.google.com/spreadsheets/d/'+S.sheetId:'')}" placeholder="https://docs.google.com/spreadsheets/d/...">`
    :`<p class="small">Paste the web app URL from the Practice progress Apps Script (it ends in /exec). Each round adds a row to the Spelling tab.</p>
      <label for="sheet">Apps Script web app URL</label><input class="field" id="sheet" value="${esc(S.sheetUrl||'')}" placeholder="https://script.google.com/macros/s/.../exec">`}
    <div class="row"><button class="btn secondary" id="sheetSave">Save and send a test row</button><span class="small muted" id="sheetMsg"></span></div>
   </section>
   <section class="card"><h2>Saving</h2>
    <p class="small">${SYNC==='account'?'Progress is saved to your Claude account and in this browser.':'Progress is saved in this browser on this device. Download a backup now and then, in case browser data is cleared.'}</p>
    <div class="row"><button class="btn secondary" id="bk">Download backup</button><label class="btn secondary filebtn" for="rs">Restore backup</label><input type="file" id="rs" accept=".json,application/json" hidden><button class="btn secondary" id="csv">Download rounds (CSV)</button></div>
    <p class="small" id="rsMsg"></p>
   </section>
   <section class="card"><h2>Settings</h2>
    <label class="check"><input type="checkbox" id="voice" ${S.voice!==false?'checked':''}> Read words aloud${HAS_TTS?'':' (this browser has no speech)'}</label>
    ${HAS_TTS?`<label for="vsel">Voice</label><select class="field" id="vsel">${englishVoices().map(v=>`<option value="${esc(v.name)}" ${VOICE&&VOICE.name===v.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>
    <label for="vrate">Speed</label><input type="range" id="vrate" min="0.6" max="1.1" step="0.05" value="${S.rate||.9}">

    <p class="small muted">Voices come from the device and browser. The most natural free ones are the "Natural" voices in Microsoft Edge and the "Google" voices in Chrome. On a Mac or iPad, you can download better "Enhanced" voices in Settings > Accessibility > Spoken Content.</p>`:''}
    <div class="row"><button class="btn secondary" id="recheck">Redo the quick check</button></div>

    <form id="addf" class="row" autocomplete="off"><input class="field grow" id="cw" placeholder="Correct spelling" aria-label="Correct spelling" autocapitalize="off" spellcheck="false"><input class="field grow" id="cx" placeholder="How she spelled it" aria-label="How she spelled it" autocapitalize="off" spellcheck="false"><button class="btn secondary" type="submit">Add</button></form>
    ${S.custom.length?`<p class="small">${S.custom.map((c,i)=>`${esc(c.w)} <button class="link" data-del="${i}">remove</button>`).join(' · ')}</p>`:''}
    <div class="row"><button class="btn secondary danger" id="reset">Reset ${esc(studentName())}'s progress</button><button class="btn" id="resetYes" hidden>Yes, erase it</button></div>
   </section>`;
  $('back').onclick=home; $('map').onclick=()=>{OPEN_PHASE=null;trailMap()};
  const readNames=()=>app.querySelectorAll('[data-nm]').forEach(i=>{const x=ROSTER.students.find(y=>y.id===i.dataset.nm);if(x)x.name=i.value.trim().slice(0,30)});
  $('saveNames').onclick=()=>{readNames();syncRoster();$('stMsg').textContent='Saved.'};
  $('addSt').onclick=()=>{readNames();addStudent('Student '+(ROSTER.students.length+1));syncRoster();grownups()};
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(b.textContent!=='Sure? Tap again'){b.textContent='Sure? Tap again';return}
    ROSTER.students=ROSTER.students.filter(x=>x.id!==b.dataset.rm);try{localStorage.removeItem(skey(b.dataset.rm))}catch(e){}syncRoster();grownups()});
  $('sheetSave').onclick=async()=>{const v=$('sheet').value.trim();const msg=$('sheetMsg');
    if(IN_CLAUDE){const m=v.match(/\/d\/([a-zA-Z0-9-_]+)/);S.sheetId=m?m[1]:(/^[a-zA-Z0-9-_]{20,}$/.test(v)?v:'');if(!S.sheetId){msg.textContent='That doesn\'t look like a Google Sheet link.';return}}
    else{if(v&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){msg.textContent='The URL should start with https://script.google.com and end with /exec.';return}S.sheetUrl=v}
    save(); msg.textContent='Sending…';
    await logRound([dayLabel(dayNum()),new Date().toTimeString().slice(0,5),'Test','','Connection test','','','','',S.gems]); S.log.pop(); save();
    msg.textContent=IN_CLAUDE?(S.sheetOk?'Test row added. Check the Spelling tab.':'Could not reach the sheet. Check the link and the Google Sheets permission.'):'Sent. Check the Spelling tab for a test row.';};
  $('bk').onclick=()=>{save();const all={v:3,roster:ROSTER,students:{}};ROSTER.students.forEach(x=>all.students[x.id]=x.id===student().id?S:readStudent(x.id));
    download('spelling-backup-'+dayLabel(dayNum())+'.json',JSON.stringify(all),'application/json')};
  $('csv').onclick=()=>download('spelling-rounds.csv',[SHEET_HEADER,...ROSTER.students.flatMap(x=>((x.id===student().id?S:readStudent(x.id))||{log:[]}).log.map(r=>[x.name||'Student 1',...r]))].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');
  $('rs').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
      if(d.v===3&&d.roster&&d.students){ROSTER=d.roster;saveRoster();Object.entries(d.students).forEach(([id,st])=>{if(st)try{localStorage.setItem(skey(id),JSON.stringify(st))}catch(e){}});
        S=readStudent(student().id)||blank();syncRoster();save(true);}
      else if(d.v===2){S=Object.assign(blank(),d);save(true);} else throw 0;
      $('rsMsg').textContent='Backup restored.'}catch(x){$('rsMsg').textContent='That file is not a spelling backup.'}};r.readAsText(f)};
  $('voice').onchange=e=>{S.voice=e.target.checked;save()};
  if($('vsel')){$('vsel').onchange=e=>{S.voiceName=e.target.value;pickVoice();save();say('Hello! Let\'s spell together.')};
    $('vrate').onchange=e=>{S.rate=+e.target.value;save();say('beach')};

  $('reset').onclick=()=>{$('resetYes').hidden=false};
  $('resetYes').onclick=()=>{const keep={sheetId:S.sheetId,sheetUrl:S.sheetUrl,custom:S.custom};S=Object.assign(blank(),keep);save(true);OPEN_PHASE=null;home()};
  window.scrollTo(0,0);
}

connect();
